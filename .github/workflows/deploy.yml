# Every push to main: build the web app and the API into one package and deploy it to the Azure App Service "onlycars" (2026-10-31).
# The tests run on the developer's machine before a push; several need SQL Server LocalDB, which GitHub's Linux runners don't have.
# The database tables are created and updated by the app itself when it starts (appsettings.Production.json).
name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build the web app
        working-directory: client
        run: |
          npm ci
          npm run build

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build the API with the web app in wwwroot
        run: |
          dotnet publish src/OnlyCars.Api -c Release -o publish
          cp -r client/dist publish/wwwroot

      - uses: azure/webapps-deploy@v3
        with:
          app-name: onlycars
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
