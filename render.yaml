# Render Blueprint (2026-11-01): one free web service built from the Dockerfile, redeployed on every push to main.
# Values marked sync: false are secrets; Render asks for them when the Blueprint is created and never reads them from here.
services:
  - type: web
    name: onlycars
    runtime: docker
    plan: free
    region: frankfurt # stays as it was; the database moves to Supabase (Postgres) in DB-1
    branch: main
    autoDeploy: true
    healthCheckPath: /api/auth/providers
    envVars:
      - key: ConnectionStrings__Default
        sync: false
      - key: Jwt__SigningKey
        sync: false
      - key: Google__ClientId
        sync: false
      - key: Client__Origins__0
        sync: false
      - key: R2__AccountId
        sync: false
      - key: R2__AccessKeyId
        sync: false
      - key: R2__SecretAccessKey
        sync: false
      - key: R2__BucketName
        sync: false
      # ERR-1: the onlycars-api DSN (read at runtime) and the onlycars-web DSN (a build arg of the Docker client stage). Empty: Sentry off.
      - key: Sentry__Dsn
        sync: false
      - key: VITE_SENTRY_DSN
        sync: false
